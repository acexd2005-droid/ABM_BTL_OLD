
# ABM THEO QUY - THAM SO GIA DINH
# Khoi tao: Q1/2023
# 18 buoc: Q2/2023 den Q3/2027
# Chinh sach kich hoat tu Q4/2026

# Ten n_months duoc giu de tuong thich code; gia tri la SO QUY.
n_months: 18
n_runs: 60
base_seed: 202611

# Dải do nhay tu dong: 0.30 = +/-30% quanh tham so co so.
# Chi co gia tri co so can duoc Huy chinh trong parameters.
sensitivity_relative_width: 0.30

# Loi suat nhap/xuat la %/nam, nhung tang truong so du la moi QUY.
# policy_month = 14 => lan kich hoat dau tien la buoc 15 (2026Q4).
# Cac gia tri hien tai la GIA DINH, chua la he so hoi quy.
parameters:
  policy_month: 14
  policy_pressure: 0.65
  policy_step: 0.28

  depositor_sensitivity: 0.035
  borrower_elasticity: 0.012
  pass_through: 0.48

  deposit_competition: 0.07
  deposit_cap_factor: 0.25

  # Tran ky thuat cho ty le du no / tien gui
  max_loan_to_deposit: 1.60

  # Hang so hanh vi truoc day cung trong code (gia tri giu nguyen, GIA DINH chua hieu chinh)
  base_deposit_rate_step: 0.018    # diem %/nam moi QUY: muc tang co so cua lai suat huy dong
  loan_spread_add: 1.35            # diem %: bien cong them vao muc tieu lai suat cho vay
  borrower_reference_rate: 9.5     # %/nam: lai suat cho vay tham chieu cua khoi nguoi vay
  borrower_base_growth: 0.006      # ty le/QUY: tang truong du no co so tai lai suat tham chieu
  margin_floor: 2.2                # diem %: bien nim_proxy tham chieu trong xac suat tuan thu cua NHNN

  # Giai doan 9a: cac hang so hanh vi con lai truoc day cung trong src/agents/ (gia tri GIU NGUYEN = hanh vi cu,
  # GIA DINH chua hieu chinh). Doi gia tri o day se doi ket qua; golden tao voi cac gia tri nay.
  target_margin: 3.2               # diem %/nam: bien muc tieu BAN DAU cua moi NH (chi khi du lieu khong co cot target_margin)
  funding_cost_add: 0.15           # diem %/nam: chi phi von ngoai lai tien gui, funding_cost = deposit_rate*(1-casa) + 0.15
  deposit_ldr_target: 0.82         # ty le: nguong LDR (du no/tien gui) cua ap luc huy dong, demand_pressure = LDR - 0.82
  demand_pressure_cap: 0.5         # ty le: chan doi xung |demand_pressure| <= 0.5
  depositor_base_growth: 0.004     # ty le/QUY: tang truong tien gui co so khi lai suat NH = lai suat thi truong
  depositor_max_growth: 0.04       # ty le/QUY: chan doi xung |tang truong tien gui| <= 0.04
  # Giai doan 9 (TUY CHON, mac dinh TAT): san rieng cua tang truong tien gui (ty le/QUY).
  # null = -depositor_max_growth (chan doi xung, hanh vi cu); dat so (vd -0.014) de chan bat doi xung.
  # San thuong <= 0 (cho phep giam tien gui); san > 0 la hop le nhung ep moi NH tang toi thieu moi quy -> model.py canh bao UserWarning; san > depositor_max_growth bi tu choi.
  depositor_min_growth: null
  borrower_growth_min: -0.04       # ty le/QUY: chan duoi tang truong du no mong muon
  borrower_growth_max: 0.035       # ty le/QUY: chan tren tang truong du no mong muon
  # Xac suat tuan thu cua NHNN: p = clip(logistic(coef_p*(policy_pressure - center) + coef_m*(nim - margin_floor)), min, max)
  compliance_pressure_coef: 2.5    # khong don vi: he so cua ap luc chinh sach trong logistic
  compliance_pressure_center: 0.5  # khong don vi: muc ap luc trung tinh
  compliance_margin_coef: 1.1      # 1/diem %: he so cua bien nim_proxy trong logistic
  compliance_prob_min: 0.02        # xac suat: san xac suat tuan thu
  compliance_prob_max: 0.98        # xac suat: tran xac suat tuan thu

  # --- Bien vi mo ngoai sinh trong PHUONG TRINH HUY DONG (Giai doan 8, TUY CHON, mac dinh TAT) ---
  # macro_driver: none | exogenous. Voi exogenous, trong Bank.step (sau desired_increase, deposit_cap_factor KHONG ap vao so hang nay):
  #   deposit_rate += macro_dep_speed * (ON_{t-1} + macro_dep_spread - deposit_rate_{t-1})
  # ON_{t-1} = lai suat lien ngan hang qua dem binh quan don gian cua QUY LIEN TRUOC (data/raw/sbv_lnh_qua_dem_theo_quy.csv,
  # cot bq_gian_don). Sau 2026Q3 giu ON = 3.946 cho moi kich ban. Thieu du lieu lich su => bao loi.
  # Gia tri khoi diem tu Giai doan 7b (reports/calibration/estimates_stage7b.csv; PT5-ON, bien the d, k=1, mau N=112, co so term):
  #   macro_dep_speed 0.177 = phi 0.177147 (tu dieu chinh/quy, nua vong ~3.6 quy);
  #   macro_dep_spread 1.2723 = spread_equilibrium 1.272256 (muc can bang ngu y r^D_term - ON, binh quan cac NH; mau N=104/96 cho 1.08/1.14).
  # CHUA hieu chinh lai (lambda, delta, base_step, base_growth, nguong chan: Giai doan 9). Khi giu base_step va deposit_competition,
  # muc can bang ngu y la ON + spread + drift/phi.
  # QUYET DINH cua truong nhom sau Giai doan 8: giu macro_driver: none o day de golden khong doi; cau hinh chuan cho cac giai doan sau
  # la configs/scenarios_macro.yaml (exogenous, macro_lending_on_coef = 0, macro_dep_spread = 1.2723, ON sau 2026Q3 giu 3.946,
  # khong dung ON that Q4/2026 trong kich ban vi co the da chiu tac dong cua Cong van 9608/9736; danh cho kiem dinh ngoai mau).
  macro_driver: none
  macro_dep_speed: 0.177           # phi: ty le/QUY
  macro_dep_spread: 1.2723         # diem %/nam: r^D_term can bang - ON
  macro_on_path: data/raw/sbv_lnh_qua_dem_theo_quy.csv
  # So hang ON truc tiep trong muc tieu cho vay (mac dinh 0 = TAT; chi dung de so sanh): target_rate += coef*(ON_{t-1} - ref).
  # 0.45 = tac dong dai han cua ON trong Giai doan 7 bien the (d1): 0.142/0.315 ~ 0.45; ref = trung binh ON 2023Q1-2026Q2 (14 quy,
  # mau d1) = 3.7461 vi he so duoc uoc luong tren ON da tru trung binh mau.
  # LUU Y (y nghia cua con so 0.45): la LUA CHON, khong phai kiem dinh. 0.45 = 0.142/0.3145 la he so dai han (theta/lambda) cua bien the d1
  # trong Giai doan 7, uoc luong tren ~14 diem theo quy; d1 bac bo b+gamma=1 (nen khong con la PT1 cua mo hinh); mo hinh dung pass_through 0.48
  # chu khong phai 0.3145 nen tac dong ON moi quy la 0.48*0.45 = 0.216 (khong phai 0.142). Viec tam hoa theo ref la mot lua chon quyet dinh muc.
  macro_lending_on_coef: 0.0
  macro_lending_on_ref: 3.7461     # %/nam

  # --- Co so cua deposit_rate trong du lieu ngan hang nap vao ---
  # term : (MAC DINH tu Buoc A) khi nap du lieu (--banks) quy doi deposit_rate = deposit_rate_du_lieu/(1-casa_ratio),
  #        nen funding_cost = deposit_rate_du_lieu + 0.15. Chi ap dung cho du lieu nap vao, khong cho bo gia lap.
  # total: hanh vi cu truoc Buoc A: dung nguyen deposit_rate du lieu (chi phi lai so sach tren TONG tien gui),
  #        funding_cost = deposit_rate*(1-casa)+0.15 tru CASA lan nua (CASA bi tru hai lan). Giu de doi chieu lich su
  #        (configs/scenarios_total.yaml; golden o tests/golden_total/).
  # Truong nhom duyet doi mac dinh sang term (sua loi tru CASA hai lan; total khop tot hon chi vi hai loi bu nhau).
  deposit_rate_basis: term

  # --- Hoc thich nghi cua ngan hang (TUY CHON, mac dinh TAT) ---
  # Gia tri khoi diem, CHUA HIEU CHINH, cho Huy duyet.
  # Cuoi moi quy, moi ngan hang chinh target_margin cho quy sau:
  #  - thi phan du no giam so voi quy truoc -> giam bien learning_down_step
  #  - nguoc lai, neu tang truong du no >= g* va nim_proxy >= n* -> tang bien learning_up_step
  #  - ca hai cung xay ra thi chi giam. Bien bi chan trong [margin_min, margin_max].
  adaptive_learning: false
  learning_up_step: 0.05           # diem %/QUY: buoc tang bien
  learning_down_step: 0.10         # diem %/QUY: buoc giam bien
  learning_growth_threshold: 0.006 # g*: ty le/QUY, bang tang truong du no co so
  # n*: nim_proxy binh quan gia quyen theo du no cua he thong tai t=0, tinh MOT LAN tu
  # data/clean/abm_initial_8nganhang_2023Q1.csv: nim_i = loan_rate - (deposit_rate*(1-casa_ratio)+0.15),
  # n* = sum(nim_i*loans_i)/sum(loans_i) = 5.5875. Don vi: diem %/nam. Khong tinh tu dong luc chay.
  learning_nim_threshold: 4.6331
  # n* mac dinh cho co so "term": nim_i = loan_rate - (deposit_rate + 0.15), binh quan gia quyen theo du no
  # tai t=0, tinh MOT LAN tu data/clean/abm_initial_8nganhang_2023Q1.csv = 4.6331 (o tren). Don vi: diem %/nam.
  # n* cho co so "total" (dung khi deposit_rate_basis: total): nim_i = loan_rate - (deposit_rate*(1-casa)+0.15) = 5.5875.
  learning_nim_threshold_total: 5.5875
  # LUU Y: khi deposit_rate_basis: total, learning_nim_threshold bi BO QUA, mo hinh dung learning_nim_threshold_total.
  # Quy tac hoc "relative" (TUY CHON, mac dinh TAT = absolute). CHUA HIEU CHINH, cho Huy duyet.
  #  - g_i < g_bar - theta -> giam bien; g_i > g_bar + theta VA (nim_i >= nim_bar neu bat dieu kien nim) -> tang bien; con lai giu.
  learning_rule: absolute          # absolute | relative
  learning_deadband: 0.005         # theta: ty le tang truong/QUY, vung chet quanh g_bar
  learning_benchmark: simple       # simple = binh quan don gian 8 NH | weighted = gia quyen du no
  learning_nim_condition: true     # true: chi tang bien khi nim_i >= nim_bar
  margin_min: 2.2                  # diem %: san cua target_margin
  margin_max: 4.2                  # diem %: tran cua target_margin

scenarios:
  A: "Khong can thiep"
  B: "Chi dao giam lai suat"
  C: "Chi dao va han che canh tranh huy dong"
